# Pipeline CI : verification automatique a chaque commit, sur toutes les
# branches (etape 8 du fil rouge : trigger sur commit + stage de build).
#
# Le depot contient deux paquets Node independants (api/ et mobile/), chacun
# avec son propre package.json et pnpm-lock.yaml. Chaque job installe ses
# propres dependances dans son propre conteneur ephemere : pas d'etat
# partage entre jobs, donc pas de risque qu'un job "profite" d'une
# installation faite par un autre et masque une regression.
#
# Activer "Pipelines must succeed" et proteger develop/main dans GitLab.
# La recette est un job manuel, active seulement apres provisionnement OVH.

stages:
  - quality   # lint + verification des types : rapide, echoue vite
  - test      # tests unitaires (Jest), sans base de donnees
  - build     # compilation TypeScript -> JavaScript (api/dist)
  - publish   # image issue du commit valide
  - deploy    # recette manuelle

# Meme image que le Dockerfile de l'API (node:24-alpine) : le comportement
# en CI est celui qu'on retrouvera en construisant l'image de production.
image: node:24-alpine

# corepack est fourni avec cette image Node 24. Il lit le champ "packageManager"
# du package.json ("pnpm@10.25.0") et installe/active exactement cette
# version : la pipeline utilise le meme pnpm que sur les machines de dev,
# jamais "le pnpm disponible sur l'image du jour".
.pnpm_setup:
  before_script:
    - corepack enable
    - corepack prepare --activate

# ---------------------------------------------------------------------------
# API (NestJS)
# ---------------------------------------------------------------------------

api:lint:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd api
    # --frozen-lockfile : echoue si package.json et pnpm-lock.yaml ne
    # correspondent plus, plutot que d'installer silencieusement autre
    # chose que ce qui est verrouille dans le depot.
    - pnpm install --frozen-lockfile
    - pnpm lint

api:typecheck:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd api
    - pnpm install --frozen-lockfile
    # --noEmit : verifie les types sans ecrire de fichiers, plus rapide que
    # d'attendre le stage de build pour decouvrir une erreur de typage.
    - pnpm exec tsc --noEmit

api:test:
  extends: .pnpm_setup
  stage: test
  script:
    - cd api
    - pnpm install --frozen-lockfile
    # Tests unitaires uniquement (jest, sans Mongo) : les use cases sont
    # testes avec des doublures du repository. Le job api:integration
    # ci-dessous utilise une vraie base jetable.
    - pnpm test

# Test d'integration optionnel (etape 11 des consignes) : contre une vraie
# instance MongoDB (service Docker de la pipeline), sans mock, comme l'exige
# le cahier des charges pour les tests d'integration. L'application demarree
# par le test (via Nest TestingModule + supertest) est celle qui existe
# reellement dans src/, pas une image construite a part : voir
# test/coach-users.integration-spec.ts pour le detail de ce que ca couvre.
api:integration:
  extends: .pnpm_setup
  stage: test
  services:
    # Alias explicite : "mongo" est le nom d'hote joignable depuis le job,
    # exactement comme dans MONGO_URI ci-dessous et dans docker-compose.yml.
    # Image figee a 7.0 (pas 8.0) : le runner (VPS OVH, noyau >= 6.19)
    # declenche le bug connu SERVER-121912 (TCMalloc vendorise incompatible
    # avec les noyaux recents) qui empeche mongo:8.0 de demarrer. Meme choix
    # que dans docker-compose.yml pour rester coherent.
    - name: mongo:7.0
      alias: mongo
  variables:
    # Ces identifiants n'existent que pour la duree du job, dans un
    # conteneur Mongo jetable : aucun risque a les avoir en clair ici,
    # contrairement a des secrets de production.
    MONGO_INITDB_ROOT_USERNAME: equilibre_ci
    MONGO_INITDB_ROOT_PASSWORD: equilibre_ci_password
    MONGO_URI: "mongodb://equilibre_ci:equilibre_ci_password@mongo:27017/equilibre_test?authSource=admin"
    JWT_SECRET: "ci-pipeline-dummy-jwt-secret-do-not-use-in-prod"
    JWT_REFRESH_SECRET: "ci-pipeline-dummy-jwt-refresh-secret-do-not-use"
    NODE_ENV: "test"
  script:
    - cd api
    - pnpm install --frozen-lockfile
    - pnpm test:e2e

api:build:
  extends: .pnpm_setup
  stage: build
  script:
    - cd api
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - api/dist
    expire_in: 1 day

# GHCR remplace la registry ecole inaccessible depuis les reseaux testes.
# GHCR_TOKEN doit etre masque ET protege, develop/main protegees.
# Le filtrage du job ne protege pas a lui seul les variables du projet.
docker:build:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Conserve le fonctionnement du runner existant. Isolation et privileges
    # a auditer sur le VPS ; TLS reste preferable lorsque configure cote runner.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GHCR_IMAGE: ghcr.io/hachwilliam89-spec/equilibre-api
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main")'
  before_script:
    - test -n "$GHCR_USER" && test -n "$GHCR_TOKEN"
    - printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
  script:
    - docker build -t "$GHCR_IMAGE:$CI_COMMIT_SHA" ./api
    - docker push "$GHCR_IMAGE:$CI_COMMIT_SHA"
    - docker pull "$GHCR_IMAGE:$CI_COMMIT_SHA"
    - docker image inspect --format '{{index .RepoDigests 0}}' "$GHCR_IMAGE:$CI_COMMIT_SHA" > image.ref
    - grep -Eq '^ghcr.io/hachwilliam89-spec/equilibre-api@sha256:[a-f0-9]{64}$' image.ref
    - printf 'API_IMAGE=%s\n' "$(cat image.ref)" > image.env
  artifacts:
    paths: [image.ref]
    reports:
      dotenv: image.env
    expire_in: 30 days

# Pas de needs : attendre tous les stages precedents, pas seulement l'image.
# L'image est lue depuis l'artefact de CETTE pipeline, jamais depuis latest.
deploy:recette:
  stage: deploy
  image: alpine:3.22
  dependencies: ["docker:build"]
  resource_group: recette-ovh
  interruptible: false
  timeout: 15 minutes
  environment:
    name: recette
  rules:
    - if: '$DEPLOY_RECETTE_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main")'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client bash
    - test -s "$SSH_PRIVATE_KEY" && test -s "$SSH_KNOWN_HOSTS"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
  script:
    - bash scripts/deploy-via-ssh.sh

deploy:test:
  stage: test
  script:
    - apk add --no-cache bash
    - bash scripts/test-deploy-recette.sh

# ---------------------------------------------------------------------------
# Mobile (Expo / React Native)
# ---------------------------------------------------------------------------

mobile:lint:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm lint

mobile:typecheck:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm typecheck

mobile:test:
  extends: .pnpm_setup
  stage: test
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm test
