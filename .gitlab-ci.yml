# Pipeline CI : verification automatique a chaque commit, sur toutes les
# branches (etape 8 du fil rouge : trigger sur commit + stage de build).
#
# Le depot contient deux paquets Node independants (api/ et mobile/), chacun
# avec son propre package.json et pnpm-lock.yaml. Chaque job installe ses
# propres dependances dans son propre conteneur ephemere : pas d'etat
# partage entre jobs, donc pas de risque qu'un job "profite" d'une
# installation faite par un autre et masque une regression.
#
# Activer "Pipelines must succeed" et proteger develop/main dans GitLab.
#
# Chaine ecole (evaluation), entierement sur le materiel de l'UHA :
# - CI : runner docker de la salle 102 (tag uha40-salle-102), partage avec
#   la classe, sans mode privilegie.
# - Deploiement : serveur n2 (10.6.0.3), joint en SSH depuis ce runner.
# - Images : GHCR, la registry GitLab de l'ecole (port 5050) etant bloquee
#   depuis le reseau du campus.
# La recette OVH est deployee par GitHub Actions (.github/workflows/ci.yml),
# plus par cette pipeline.
#
# Livraison et deploiement :
# - develop : deploiement continu. Une fois tous les stages verts,
#   deploy:ecole part seul.
# - main : livraison continue. deploy:ecole attend un clic : la version
#   stable n'est mise en ligne qu'apres validation humaine.
# Le deploiement reste conditionne a la variable DEPLOY_ECOLE_ENABLED.

stages:
  - quality   # lint + verification des types : rapide, echoue vite
  - test      # tests unitaires (Jest), sans base de donnees
  - build     # compilation TypeScript -> JavaScript (api/dist)
  - publish   # image issue du commit valide
  - deploy    # automatique sur develop, manuel sur main

default:
  # Tous les jobs tournent sur le runner de la salle 102 (consigne : la CI
  # sur le materiel de l'ecole). Un runner sans ce tag ne prend aucun job.
  tags:
    - uha40-salle-102
  # Meme image que le Dockerfile de l'API (node:24-alpine) : le comportement
  # en CI est celui qu'on retrouvera en construisant l'image de production.
  image: node:24-alpine

# corepack est fourni avec cette image Node 24. Il lit le champ "packageManager"
# du package.json ("pnpm@10.25.0") et installe/active exactement cette
# version : la pipeline utilise le meme pnpm que sur les machines de dev,
# jamais "le pnpm disponible sur l'image du jour".
.pnpm_setup:
  before_script:
    - corepack enable
    - corepack prepare --activate

# ---------------------------------------------------------------------------
# API (NestJS)
# ---------------------------------------------------------------------------

api:lint:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd api
    # --frozen-lockfile : echoue si package.json et pnpm-lock.yaml ne
    # correspondent plus, plutot que d'installer silencieusement autre
    # chose que ce qui est verrouille dans le depot.
    - pnpm install --frozen-lockfile
    - pnpm lint

api:typecheck:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd api
    - pnpm install --frozen-lockfile
    # --noEmit : verifie les types sans ecrire de fichiers, plus rapide que
    # d'attendre le stage de build pour decouvrir une erreur de typage.
    - pnpm exec tsc --noEmit

api:test:
  extends: .pnpm_setup
  stage: test
  script:
    - cd api
    - pnpm install --frozen-lockfile
    # Tests unitaires uniquement (jest, sans Mongo) : les use cases sont
    # testes avec des doublures du repository. Le job api:integration
    # ci-dessous utilise une vraie base jetable.
    - pnpm test

# Test d'integration optionnel (etape 11 des consignes) : contre une vraie
# instance MongoDB (service Docker de la pipeline), sans mock, comme l'exige
# le cahier des charges pour les tests d'integration. L'application demarree
# par le test (via Nest TestingModule + supertest) est celle qui existe
# reellement dans src/, pas une image construite a part : voir
# test/coach-users.integration-spec.ts pour le detail de ce que ca couvre.
api:integration:
  extends: .pnpm_setup
  stage: test
  services:
    # Alias explicite : "mongo" est le nom d'hote joignable depuis le job,
    # exactement comme dans MONGO_URI ci-dessous et dans docker-compose.yml.
    # Image figee a 7.0 (pas 8.0) : sur les noyaux Linux >= 6.19, le bug
    # connu SERVER-121912 (TCMalloc vendorise incompatible avec les noyaux
    # recents) empeche mongo:8.0 de demarrer. Meme choix
    # que dans docker-compose.yml pour rester coherent.
    - name: mongo:7.0
      alias: mongo
  variables:
    # Ces identifiants n'existent que pour la duree du job, dans un
    # conteneur Mongo jetable : aucun risque a les avoir en clair ici,
    # contrairement a des secrets de production.
    MONGO_INITDB_ROOT_USERNAME: equilibre_ci
    MONGO_INITDB_ROOT_PASSWORD: equilibre_ci_password
    MONGO_URI: "mongodb://equilibre_ci:equilibre_ci_password@mongo:27017/equilibre_test?authSource=admin"
    JWT_SECRET: "ci-pipeline-dummy-jwt-secret-do-not-use-in-prod"
    JWT_REFRESH_SECRET: "ci-pipeline-dummy-jwt-refresh-secret-do-not-use"
    NODE_ENV: "test"
  script:
    - cd api
    - pnpm install --frozen-lockfile
    - pnpm test:e2e

api:build:
  extends: .pnpm_setup
  stage: build
  script:
    - cd api
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - api/dist
    expire_in: 1 day

# Construction sans Docker-in-Docker : kaniko construit et pousse l'image
# depuis un conteneur ordinaire, donc le runner partage n'a besoin ni du mode
# privilegie ni du socket Docker de l'hote.
# GHCR_TOKEN (write:packages) doit etre masque ET protege, develop/main
# protegees. Le filtrage du job ne protege pas a lui seul les variables.
docker:build:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GHCR_IMAGE: ghcr.io/hachwilliam89-spec/equilibre-api
    SIMULATOR_IMAGE: ghcr.io/hachwilliam89-spec/equilibre-balance-simulator
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main")'
  before_script:
    - '[ -n "$GHCR_USER" ] || { echo "Variable GitLab GHCR_USER manquante"; exit 1; }'
    - '[ -n "$GHCR_TOKEN" ] || { echo "Variable GitLab GHCR_TOKEN manquante"; exit 1; }'
    - mkdir -p /kaniko/.docker
    - auth=$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')
    - printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > /kaniko/.docker/config.json
  script:
    # Cible par defaut du Dockerfile : le stage production (dernier stage).
    # --cleanup remet le conteneur a zero entre les deux constructions.
    - /kaniko/executor --context "$CI_PROJECT_DIR/api" --dockerfile "$CI_PROJECT_DIR/api/Dockerfile" --destination "$GHCR_IMAGE:$CI_COMMIT_SHA" --digest-file "$CI_PROJECT_DIR/api.digest" --cleanup
    - printf '%s@%s\n' "$GHCR_IMAGE" "$(cat api.digest)" > image.ref
    - grep -Eq '^ghcr.io/hachwilliam89-spec/equilibre-api@sha256:[a-f0-9]{64}$' image.ref
    - printf 'API_IMAGE=%s\n' "$(cat image.ref)" > image.env
    - /kaniko/executor --context "$CI_PROJECT_DIR/simulator" --dockerfile "$CI_PROJECT_DIR/simulator/Dockerfile" --destination "$SIMULATOR_IMAGE:$CI_COMMIT_SHA" --digest-file "$CI_PROJECT_DIR/simulator.digest" --cleanup
    - printf '%s@%s\n' "$SIMULATOR_IMAGE" "$(cat simulator.digest)" > simulator-image.ref
    - grep -Eq '^ghcr.io/hachwilliam89-spec/equilibre-balance-simulator@sha256:[a-f0-9]{64}$' simulator-image.ref
    - printf 'SIMULATOR_IMAGE=%s\n' "$(cat simulator-image.ref)" >> image.env
  artifacts:
    paths: [image.ref, simulator-image.ref]
    reports:
      dotenv: image.env
    expire_in: 30 days

# Tests de contrat des scripts de deploiement (Docker simule).
deploy:test:
  stage: test
  script:
    - for i in 1 2 3; do apk add --no-cache bash && break || sleep 5; done
    - bash scripts/test-deploy-recette.sh
    - bash scripts/test-deploy-simulator.sh
    - bash scripts/test-deploy-ecole.sh

# ---------------------------------------------------------------------------
# Mobile (Expo / React Native)
# ---------------------------------------------------------------------------

mobile:lint:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm lint

mobile:typecheck:
  extends: .pnpm_setup
  stage: quality
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm typecheck

mobile:test:
  extends: .pnpm_setup
  stage: test
  script:
    - cd mobile
    - pnpm install --frozen-lockfile
    - pnpm test

simulator:test:
  extends: .pnpm_setup
  stage: test
  script:
    - cd simulator
    - pnpm install --frozen-lockfile
    - pnpm test

# Deploiement ecole : le runner de la salle 102 se connecte en SSH au
# serveur n2 (10.6.0.3, meme reseau du campus) et y remplace l'API par
# l'image construite dans CETTE pipeline (artefact image.ref, par digest,
# jamais latest). Aucun code source ni secret applicatif n'est envoye :
# .env.ecole est cree une fois sur le serveur.
# Pas de needs : attendre tous les stages precedents, pas seulement l'image.
deploy:ecole:
  stage: deploy
  image: alpine:3.22
  dependencies: ["docker:build"]
  resource_group: ecole-uha
  interruptible: false
  timeout: 15 minutes
  variables:
    ECOLE_HOST: 10.6.0.3
    ECOLE_USER: uha40
  environment:
    name: ecole-dev
    url: http://10.6.0.3:3000/api
  rules:
    # develop : part seul si tous les stages precedents sont verts.
    - if: '$DEPLOY_ECOLE_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"'
      when: on_success
    # main : attend un clic de validation.
    - if: '$DEPLOY_ECOLE_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  before_script:
    - for i in 1 2 3; do apk add --no-cache openssh-client bash && break || sleep 5; done
    # Variables de type File : elles contiennent le chemin d'un fichier.
    - '[ -s "$ECOLE_SSH_PRIVATE_KEY" ] || { echo "Variable GitLab ECOLE_SSH_PRIVATE_KEY manquante ou vide"; exit 1; }'
    - '[ -s "$ECOLE_SSH_KNOWN_HOSTS" ] || { echo "Variable GitLab ECOLE_SSH_KNOWN_HOSTS manquante ou vide"; exit 1; }'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Normalise la cle collee dans l'interface GitLab : retire les retours
    # chariot, les espaces en fin de ligne et les lignes vides, et garantit
    # le retour a la ligne final. Sans cela ssh refuse la cle avec
    # "error in libcrypto".
    - tr -d '\r' < "$ECOLE_SSH_PRIVATE_KEY" | sed 's/[[:space:]]*$//' | awk 'NF' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # Diagnostic sans rien divulguer : seules les lignes d'en-tete et de fin
    # (publiques) et le nombre de lignes sont affiches.
    - 'echo "Cle : $(wc -l < ~/.ssh/id_ed25519) lignes, $(head -n 1 ~/.ssh/id_ed25519) ... $(tail -n 1 ~/.ssh/id_ed25519)"'
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "Cle ECOLE_SSH_PRIVATE_KEY illisible"; exit 1; }
    - tr -d '\r' < "$ECOLE_SSH_KNOWN_HOSTS" | awk 'NF' > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
  script:
    - bash scripts/deploy-ecole-via-ssh.sh
