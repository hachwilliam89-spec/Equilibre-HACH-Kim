# Surcharge TEST (tests d'integration, sans mock, et pipeline CI).
# Lancement : pnpm docker:test
# Projet Docker distinct (-p equilibre-test) pour pouvoir tourner
# en parallele de l'environnement de dev sans collision de conteneurs.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      # Explicite et volontaire : les tests d'integration s'executent contre
      # l'image de production, celle qui sera reellement deployee, et non
      # contre le stage de developpement.
      target: production
    container_name: equilibre-api-test
    ports:
      - "${API_PORT}:3000"
    # Pas de redemarrage automatique : un conteneur de test qui plante
    # doit rester plante pour que la CI le voie.
    restart: "no"

  mongo:
    container_name: equilibre-mongo-test
    # Cache WiredTiger limite : par defaut Mongo reserve ~3,4 Go calcules
    # sur la RAM de la machine, inutile pour une base de dev ou de test.
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "${MONGO_PORT}:27017"
    restart: "no"
    # Base EPHEMERE : stockage en memoire, conserve tant que le conteneur tourne.
    # Relancer Jest ne vide pas la base. Pour repartir de zero :
    # pnpm docker:test:down puis pnpm docker:test.
    tmpfs:
      - /data/db
