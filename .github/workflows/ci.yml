# Miroir GitHub Actions de la pipeline GitLab CI (.gitlab-ci.yml, qui reste
# la pipeline de reference pour le rendu du fil rouge). Meme decoupage :
# qualite -> tests -> build, sur les deux paquets independants api/ et
# mobile/. Se declenche sur push et pull_request, sur toutes les branches.

name: CI

on:
  push:
  pull_request:

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm lint

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm test

  api-build:
    runs-on: ubuntu-latest
    needs: [api-lint, api-typecheck, api-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm run build

  mobile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm lint

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm typecheck

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm test
