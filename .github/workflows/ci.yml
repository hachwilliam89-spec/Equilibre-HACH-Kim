# Miroir GitHub Actions de la pipeline GitLab CI (.gitlab-ci.yml, qui reste
# la pipeline de reference pour le rendu du fil rouge). Meme decoupage :
# qualite -> tests -> build, sur les deux paquets independants api/ et
# mobile/. Se declenche sur push et pull_request, sur toutes les branches.

name: CI

on:
  push:
  pull_request:

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm lint

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm test

  api-build:
    runs-on: ubuntu-latest
    needs: [api-lint, api-typecheck, api-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm run build

  api-integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: equilibre_ci
          MONGO_INITDB_ROOT_PASSWORD: equilibre_ci_password
    env:
      # GitHub Actions expose les services via localhost (port mappe),
      # a la difference de GitLab CI qui joint le service par son alias.
      MONGO_URI: "mongodb://equilibre_ci:equilibre_ci_password@localhost:27017/equilibre_test?authSource=admin"
      JWT_SECRET: "ci-pipeline-dummy-jwt-secret-do-not-use-in-prod"
      JWT_REFRESH_SECRET: "ci-pipeline-dummy-jwt-refresh-secret-do-not-use"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: api
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm test:e2e

  mobile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm lint

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm typecheck

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - working-directory: mobile
        run: |
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm test
